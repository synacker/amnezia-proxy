name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: 1.25.x
        cache: true

    - name: Install dependencies
      run: go mod download

    - name: Build
      run: |
        go build -trimpath -ldflags '-s -w' -o amnezia-proxy .

    - name: Test
      run: go test -v ./...

    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: amnezia-proxy-linux
        path: amnezia-proxy