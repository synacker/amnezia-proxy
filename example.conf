# Example AmneziaWG client configuration for awg-proxy.
#
# Export this from the AmneziaVPN client ("Share" -> config file), or fill in
# your own keys. The format is the standard wg-quick INI format with the
# additional AmneziaWG obfuscation parameters.
#
# All values below are placeholders — replace them with real ones.

[Interface]
PrivateKey = <base64-private-key>
Address = 10.66.66.2/32
DNS = 1.1.1.1, 8.8.8.8
# MTU = 1420

# --- AmneziaWG obfuscation (must match the server) ---
Jc = 4
Jmin = 40
Jmax = 70
S1 = 15
S2 = 25
# S3 and S4 default to 0 if omitted.
# H1..H4 are header ranges; set only if the server requires them.
# H1 = 123
# H2 = 456
# H3 = 789
# H4 = 1011
# I1..I5 are optional custom signature packets, e.g.:
# I1 = <b 0x0123456789abcdef><r 16><t>
# Header protection (needs S1..S4 >= 12; must match the server):
# HeaderProtectionKey = <base64-header-protection-key>
# RandomTrailers = on
# DisableCookies = on

[Peer]
PublicKey = <base64-server-public-key>
PresharedKey = <base64-preshared-key>
AllowedIPs = 0.0.0.0/0
Endpoint = vpn.example.com:51820
PersistentKeepalive = 25
